name: offline-validation

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,solvers]"
      - run: python -m pytest -q
      - run: python -m src.pipeline --mode smoke --output-dir reports
      - run: python -m src.reporting.claim_audit
      - run: python -m src.reporting.benchmark
