[project]
name = "increment-decision-engine"
version = "0.0.1"
requires-python = ">=3.11,<3.13"
dependencies = [
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "PyYAML>=6,<7",
    "duckdb",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest_tmp"

[tool.setuptools.packages.find]
include = ["src*"]
